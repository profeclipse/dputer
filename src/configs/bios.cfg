MEMORY {
    ZP:       start = $0000, size = $0100, type = rw,             define = yes,  file = "";
    STACK:    start = $0100, size = $0100, type = rw,                            file = "";
    IO:       start = $0200, size = $0100, type = rw,                            file = "";
    KBD:      start = $0300, size = $0100, type = rw,                            file = "";
    INPUT:    start = $0400, size = $0100, type = rw,                            file = "";
    RAM:      start = $0500, size = $E000 - $0500, type = rw,                    file = "";
    BIOS:     start = $E000, size = $1F00, type = ro, fill = yes,                file = %O;
    BIOSJUMP: start = $FF00, size = $00FA, type = ro, fill = yes,                file = %O;
    VECTORS:  start = $FFFA, size = $0006, type = ro, fill = yes,                file = %O;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp, optional = yes;
    RAM:       load = RAM,      type = rw, optional = yes;
    BIOS:      load = BIOS,     type = ro;
    JUMPTABLE: load = BIOSJUMP, type = ro, optional = yes;
    VECTORS:   load = VECTORS,  type = ro;
}

