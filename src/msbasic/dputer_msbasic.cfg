MEMORY {
    ZP:       start = $0000, size = $0100,            type = rw,             define = yes,  file = "";
    STACK:    start = $0100, size = $0100,            type = rw,                            file = "";
    IO:       start = $0200, size = $0100,            type = rw,                            file = "";
    KBD:      start = $0300, size = $0100,            type = rw,                            file = "";
    INPUT:    start = $0400, size = $0100,            type = rw,                            file = "";
    RAM:      start = $0500, size = $B000 - $0500,    type = rw,                            file = "";
    LOADADDR: start = $7FFE, size = $0002,            type = ro, fill = yes,                file = %O;
    BASIC:    start = $B000, size = $E000 - $B000,    type = ro,                            file = %O;
    BIOS:     start = $E000, size = $1F00,            type = ro, fill = yes,                file = "";
    BIOSJUMP: start = $FF00, size = $00FA,            type = ro, fill = yes,                file = "";
    CPUVEC:   start = $FFFA, size = $0006,            type = ro, fill = yes,                file = "";
    DUMMY:    start = $0000, size = $00FF,                                                  file = "";
}

SEGMENTS {
    ZEROPAGE:   load = ZP,      type = zp;
    LOADADDR:   load = LOADADDR,type = ro;
    HEADER:     load = BASIC,   type = ro;
    VECTORS:    load = BASIC,   type = ro;
    KEYWORDS:   load = BASIC,   type = ro;
    ERROR:      load = BASIC,   type = ro;
    CODE:       load = BASIC,   type = ro;
    CHRGET:     load = BASIC,   type = ro;
    INIT:       load = BASIC,   type = ro;
    EXTRA:      load = BASIC,   type = ro;
    DUMMY:      load = DUMMY;
}

